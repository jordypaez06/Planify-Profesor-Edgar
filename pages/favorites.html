<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Consulta tus destinos favoritos guardados y planifica tu próximo viaje con Planify.">
  <title>Mis favoritos · Planify</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css?v=20260909">
</head>
<body>

  <header class="navbar" id="navbar"></header>

  <main>
    <section class="page-hero container">
      <span class="section-tag">Favoritos</span>
      <h1>Tus destinos favoritos</h1>
      <p>Los países que guardaste se almacenan en tu navegador y estarán disponibles cada vez que visites Planify.</p>
      <div style="margin-top: 22px;">
        <a href="explore.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Agregar destinos</a>
      </div>
    </section>

    <section class="section" style="padding-top: 0;">
      <div class="container">
        <div id="messageArea"></div>

        <div class="fav-grid" id="favoritesGrid">
          <!-- Tarjetas generadas por JavaScript -->
        </div>

        <!-- Estado vacío -->
        <div class="card empty-state" id="emptyState" style="display:none;">
          <div class="empty-icon">🧳</div>
          <h3>Aún no tienes favoritos</h3>
          <p>Explora los destinos y pulsa el corazón para guardar los que te enamoren.</p>
          <div style="margin-top: 20px;">
            <a href="explore.html" class="btn btn-primary"><i class="bi bi-compass"></i> Explorar destinos</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="../js/app.js?v=20260916"></script>
  <script src="../js/favorites.js?v=20260909"></script>
</body>
</html>
